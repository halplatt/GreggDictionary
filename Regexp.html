    <title>Regular Expressions Demonstration</title>
    <script>
    // JavaScript replacements for VBScript handlers
    function getFlags() {
        const ignore = document.getElementById('selIgnore');
        const global = document.getElementById('selGlobal');
        let flags = '';
        if (global && global.value === '1') flags += 'g';
        if (ignore && ignore.value === '1') flags += 'i';
        return flags;
    }

    function buildRegex() {
        const pattern = document.getElementById('txtPattern').value;
        const flags = getFlags();
        try {
            return new RegExp(pattern, flags);
        } catch (e) {
            alert('Invalid regular expression: ' + e.message);
            throw e;
        }
    }

    function clearTable(tbl) {
        while (tbl.firstChild) tbl.removeChild(tbl.firstChild);
    }

    function btnExecute_onclick() {
        const regex = buildRegex();
        const text = document.getElementById('txtArea').value;
        const tbl = document.getElementById('TblResult');
        clearTable(tbl);

        const caption = tbl.createCaption();
        const flags = getFlags();
        let matches = [];
        if (flags.includes('g')) {
            matches = Array.from(text.matchAll(regex));
        } else {
            const m = regex.exec(text);
            if (m) matches = [m];
        }
        caption.innerText = 'objMatches.count = ' + matches.length;

        const thead = tbl.createTHead();
        const hrow = thead.insertRow();
        ['Match.FirstIndex', 'Match.Length', 'Match.Value'].forEach(h => {
            const c = hrow.insertCell();
            c.innerText = h;
        });

        const lblCount = document.getElementById('lblCount');
        if (lblCount) lblCount.textContent = 'colMatches.count=' + matches.length;

        if (matches.length > 0) {
            const first = matches[0];
            const subCount = (first.length > 1) ? first.length - 1 : 0;
            if (subCount > 0) {
                if (lblCount) lblCount.textContent += ' colMatches(0).submatches.count=' + subCount;
                for (let i = 0; i < subCount; i++) {
                    const c = hrow.insertCell();
                    c.innerText = 'Match.SubMatches(' + i + ')=$' + (i + 1);
                }
            }
        }

        matches.forEach(m => {
            const row = tbl.insertRow();
            const idx = (typeof m.index === 'number') ? m.index : text.indexOf(m[0]);
            const cells = [idx, m[0].length, m[0]];
            cells.forEach(val => { const c = row.insertCell(); c.innerText = String(val); });
            // submatches (capture groups)
            for (let i = 1; i < m.length; i++) {
                const c = row.insertCell();
                c.innerText = m[i] != null ? m[i] : '';
            }
        });
    }

    function btnCustomReplace_onclick() {
        const regex = buildRegex();
        const text = document.getElementById('txtArea').value;
        const replaceTpl = document.getElementById('txtReplace').value;
        const out = document.getElementById('txtReplaceResult');
        out.value = '';
        const flags = getFlags();
        let matches = [];
        if (!flags.includes('g')) {
            // Ensure we can iterate all matches like VBScript.Execute; if not global, just first
            const m = regex.exec(text);
            if (m) matches = [m];
        } else {
            matches = Array.from(text.matchAll(regex));
        }
        matches.forEach(m => {
            let line = replaceTpl;
            for (let i = 1; i < m.length; i++) {
                const token = '$' + i;
                const val = m[i] != null ? String(m[i]) : '';
                // replace all occurrences of $i
                line = line.split(token).join(val);
            }
            out.value += line;
        });
    }

    function btnReplace_onclick() {
        const regex = buildRegex();
        const text = document.getElementById('txtArea').value;
        const replaceStr = document.getElementById('txtReplace').value;
        document.getElementById('txtReplaceResult').value = text.replace(regex, replaceStr);
    }

    function btnTest_onclick() {
        const regex = buildRegex();
        const text = document.getElementById('txtArea').value;
        const result = regex.test(text);
        const lbl = document.getElementById('lblTestResult');
        if (lbl) lbl.textContent = String(result);
        alert(result);
    }

    function selRegExpPatterns_onclick() {
        const sel = document.getElementById('selRegExpPatterns') || document.querySelector('[name="selRegExpPatterns"]');
        if (!sel) return;
        const txt = document.getElementById('txtPattern');
        if (sel.value === '') { // placeholder selected: clear the pattern box
            if (txt) txt.value = '';
            return;
        }
        if (txt) txt.value = sel.value;
    }

    function txtFileToLoad_onchange() {
        const input = document.getElementById('txtFileToLoad');
        const ta = document.getElementById('txtArea');
        if (!input || !input.files || input.files.length === 0) return;
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = () => { ta.value = reader.result; };
        reader.onerror = () => { alert('Failed to read file: ' + reader.error); };
        reader.readAsText(file);
    }

    function onReady() {
        // Developer-focused RegExp capabilities summary
        const lbl = document.getElementById('lblVersion');
        if (lbl) {
            const ua = navigator.userAgent || '';
            const isFirefox = typeof InstallTrigger !== 'undefined';
            const isEdge = ua.includes('Edg/');
            const isChrome = !isEdge && !!window.chrome && ua.includes('Chrome/');
            const isSafari = !isChrome && !isFirefox && ua.includes('Safari/') && ua.includes('Version/');
            const isNodeWebkit = ua.includes('Electron/');

            function getBrowserInfo() {
                const info = { name: 'Unknown', version: '' };
                const m = {
                    Chrome: /Chrome\/(\d+)/,
                    Edge: /Edg\/(\d+)/,
                    Firefox: /Firefox\/(\d+)/,
                    Safari: /Version\/(\d+).+Safari\//,
                    Electron: /Electron\/(\d+)/
                };
                let match;
                if ((match = m.Edge.exec(ua))) return { name: 'Edge', version: match[1] };
                if ((match = m.Chrome.exec(ua))) return { name: 'Chrome', version: match[1] };
                if ((match = m.Firefox.exec(ua))) return { name: 'Firefox', version: match[1] };
                if ((match = m.Safari.exec(ua))) return { name: 'Safari', version: match[1] };
                if ((match = m.Electron.exec(ua))) return { name: 'Electron', version: match[1] };
                return info;
            }

            const engine = isFirefox ? 'SpiderMonkey (Firefox)'
                          : isChrome || isEdge || isNodeWebkit ? 'V8 (Chromium-based)'
                          : isSafari ? 'JavaScriptCore (WebKit)'
                          : navigator.product || 'Unknown';

            function supportsFlag(f) {
                try { new RegExp('', f); return true; } catch { return false; }
            }
            const flagList = ['g','i','m','u','y','s','d'];
            const flagsSupported = flagList.filter(supportsFlag);
            const FLAG_LABELS = {
                g: 'global',
                i: 'ignoreCase',
                m: 'multiline',
                u: 'unicode',
                y: 'sticky',
                s: 'dotAll',
                d: 'hasIndices'
            };
            const flagsDecorated = flagsSupported.map(f => `${f} (${FLAG_LABELS[f] || '?'})`).join(', ');

            // Feature probes
            let hasLookbehind = false;
            try { hasLookbehind = /(?<=a)b/.test('ab'); } catch {}

            let hasNamedGroups = false;
            try {
                const m = /(?<grp>a)/.exec('a');
                hasNamedGroups = !!(m && m.groups && m.groups.grp === 'a');
            } catch {}

            let hasUnicodeProps = false;
            try { hasUnicodeProps = /\p{L}/u.test('A'); } catch {}

            const binfo = getBrowserInfo();
            const features = [
                `flags=[${flagsDecorated}]`,
                `lookbehind=${hasLookbehind ? 'yes' : 'no'}`,
                `namedGroups=${hasNamedGroups ? 'yes' : 'no'}`,
                `unicodeProps=\\p{..} ${hasUnicodeProps ? 'yes' : 'no'}`
            ].join(' | ');

            lbl.textContent = `RegExp: ${features} | Engine=${engine} | Browser=${binfo.name}${binfo.version ? ' ' + binfo.version : ''}`;
        }
        // Attach change handler for file input (in case inline attribute isn't honored)
        const fileInput = document.getElementById('txtFileToLoad');
        if (fileInput) fileInput.addEventListener('change', txtFileToLoad_onchange);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', onReady);
    } else {
        onReady();
    }
    </script>

    <h3>Regular Expression Information</h3>
    <!-- Regular Expression Pattern Input -->
    <p>RegExp.Pattern = 
        <input id="txtPattern" value="\w+" name="text1" class="Demo" size="29" style="width: 382px; height: 35px" title="txtPattern (The Regular Expression goes here)">
        &nbsp;
    <select id="selRegExpPatterns" size="1" name="selRegExpPatterns" class="Demo" title="Optional: select a pre-defined pattern" onchange="selRegExpPatterns_onclick()">
    <option value="" selected>Optional: select a pre-defined pattern</option>
<option value="((\(\d{3}\) ?)|(\d{3}-))?\d{3}-\d{4}">Phone</option>
<option value="\d{3}-\d{2}-\d{4}">Social Security</option>
<option value="\w+([-+.]\w+)*@\w+([-.]\w+)*\.\w+([-.]\w+)*">E-mail</option>
<option value="http://([\w-]+\.)+[\w-]+(/[\w- ./?%&amp;=]*)?" >URL</option>
<option value="\d{5}(-\d{4})?">Zip Code</option>
<option value="[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}">GUID</option>
<option value="<[^>]+>">HTML Tag</option>
<option value="\b(.+)\s\1">Repeated Word</option>
        </select>
    </p>

    <!-- Ignore Case Selection -->
    <p>RegExp.IgnoreCase =&nbsp;&nbsp;
        <select id="selIgnore" style="width: 78px; height: 78px" name="selIgnore" class="Demo" title="selIgnore (The value to be used for Ignore)">
            <option value="1" selected>True</option>
            <option value="0">False</option>
        </select>
    </p>

    <!-- Global Selection -->
    <p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; RegExp.Global =&nbsp;&nbsp;
        <select id="selGlobal" style="width: 78px; height: 78px" name="selGlobal" class="Demo" title="selGlobal (The Value to be used for Global)">
            <option value="1" selected>True</option>
            <option value="0">False</option>
        </select>
    </p>

    <!-- Buttons for various actions -->
    <input id="btnTest" type="button" value="Test -- blnResult = RegExp.Test(Text)" class="Demo" onclick="btnTest_onclick()">
    <span id="lblTestResult" class="demo">&nbsp;</span>
    <br>

    <input id="btnExecute" type="button" value="Execute -- colMatches = RegExp.Execute(Text)" class="Demo" onclick="btnExecute_onclick()">
    <span id="lblCount" class="demo">&nbsp;</span>

    <h3>Original Text Here</h3>
    <textarea class="demo" id="txtArea" title="txtArea (The text to be used by regular expression methods)" style="width: 860px; height: 298px" name="textarea1" rows="4" cols="93">Some default text to test with...</textarea>

    <h3>Replacement Pattern</h3>
    <textarea class="demo" id="txtReplace" title="Replace (The text to be used by Replace method)" style="width: 860px; height: 298px" name="textarea1" rows="4" cols="93">Replace</textarea>

    <input id="btnReplace" type="button" value="Replace -- Text = RegExp.Replace(Text, ReplaceText)" class="Demo" onclick="btnReplace_onclick()">
    <input id="btnCustomReplace" type="button" value="Custom Replace -- Custom Replace Matches" class="Demo" onclick="btnCustomReplace_onclick()">

    <h3>Text After Replacement</h3>
    <textarea class="demo" id="txtReplaceResult" title="txtReplacedResult (The text after using the replace command)" style="width: 860px; height: 298px" name="textReplaceResult" rows="4" cols="93"></textarea>

    <input id="txtFileToLoad" style="width: 393px; height: 22px" type="file" size="32" onchange="txtFileToLoad_onchange()">

    <table id="TblResult" cellspacing="0" cellpadding="0" width="75%" border="1" class="Demo" style="border-collapse: collapse" bordercolor="#111111">
    </table>
